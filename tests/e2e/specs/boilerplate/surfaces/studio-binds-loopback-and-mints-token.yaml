# yaml-language-server: $schema=https://github.com/shivamstaq/gotit/raw/main/schema/spec.schema.json
spec_version: 1
name: studio-binds-loopback-and-mints-token
description: 'SPEC §9.6 invariants: Studio binds 127.0.0.1 only and mints a per-session token; oneshot mode exits clean for CI.'
tags: [boilerplate, surfaces, studio, p0t42]
order: 61
repo:
  helper: go-module-empty

setup:
  - name: init
    command: graph-harness init
    assert:
      - { type: exit_code, expected: 0 }

steps:
  - name: studio_oneshot
    command: graph-harness studio --oneshot
    assert:
      - { type: exit_code, expected: 0 }
      - { type: contains, value: "Studio: http://127.0.0.1:" }
      - { type: contains, value: "?token=" }
      - { type: contains, value: "Bound to loopback" }
