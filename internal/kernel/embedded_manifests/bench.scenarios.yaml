apiVersion: graph-harness.kernel/v1
kind: Layer
metadata:
  name: bench.scenarios
  version: 0.1.0
  depends_on: []                    # independent of production layers
  description: >
    Benchmark fixtures: repo snapshots + target diffs that exercise specific
    capabilities. Phase 0 ships scenario 1 (auth-sensitive edit, Go) in
    mature regime only. Full corpus + four-axis scoring lands in P6.

schema:
  entity_kinds:
    - name: Scenario
      attributes:
        id:          { type: int, indexed: true }
        name:        { type: string, indexed: true }
        regime:      { type: enum, indexed: true }       # mature|cold|drift|adversarial
        repo_snapshot: { type: opaque_blob, indexed: false }
        target_diff: { type: opaque_blob, indexed: false }
  relation_kinds: []

capabilities:
  - kv_lookup_by_id
  - filter_by_attribute:
      fields: [id, regime]
      ops: [eq]

events:
  emits:
    - ScenarioRegistered

storage:
  adapter: sqlite
  durability: persistent
  mutability: authored

snapshot:
  supports_as_of_seq: false
  strategy: external_source
  retention:
    events: 0
    duration: "0h"

trust:
  direct_writes_from:
    - importer:bench_fixture
    - kernel_replay
  review_required_from: []
  forbidden_from:
    - user
    - agent

sync:
  mode: local_only
