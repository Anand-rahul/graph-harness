apiVersion: graph-harness.kernel/v1
kind: Layer
metadata:
  name: history.evolution
  version: 0.1.0
  depends_on:
    - code.core@^0.1.0
  description: >
    Replay and drift signals derived from commit history. Bitemporal per
    SPEC §6.5 (XTDB pattern): valid_from/valid_to (domain time) +
    tx_from/tx_to (kernel seq). Phase 0 ships the layer registered with no
    commit ingestion — empty results. Co-change + multi-anchor maturity
    work lands in P5.

schema:
  entity_kinds: []                  # populated when commit ingestion lands (P5)
  relation_kinds: []

capabilities:
  - kv_lookup_by_id
  - as_of_seq_read

events:
  emits: []                         # populated in P5

storage:
  adapter: sqlite                   # DuckDB attached for analytics is post-P0
  durability: persistent
  mutability: derived

snapshot:
  supports_as_of_seq: true
  strategy: periodic_materialization
  retention:
    events: 1000000
    duration: "8760h"               # 1y of commits

trust:
  direct_writes_from:
    - kernel_replay
    - extractor:git_history         # P5
  review_required_from: []
  forbidden_from:
    - user
    - agent

sync:
  mode: pull_replica                # team server has shared history (SPEC §6.6)

freshness_states:
  - indexed
  - partial
  - stale
  - replaying
